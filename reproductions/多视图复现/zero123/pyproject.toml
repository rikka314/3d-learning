[project]
name = "zero123plus-reproduction"
version = "0.1.0"
description = "Pinned minimal inference environment for Zero123++ v1.2"
requires-python = "==3.11.*"
dependencies = [
  "accelerate==1.8.1",
  "diffusers==0.20.2",
  "huggingface-hub==0.25.2",
  "numpy==1.26.4",
  "pillow==11.2.1",
  "requests==2.32.4",
  "safetensors==0.5.3",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers==4.29.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

